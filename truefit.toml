[[standin]]
name = "sesame"
run = ["tests/contract/sesame-steps", "tests/contract/fake-sesame"]
real = ["tests/contract/sesame-steps", "sesame"]
needs = "sesame on PATH (brew install sunfmin/tap/sesame); it writes only the case's own store"
ready = ["sesame", "--version"]
version = ["sesame", "--version"]
faults = ["token-refused", "add-refused"]
fault_env = "FAKE_SESAME_FAULT"

[[standin.case]]
name = "provider-made-once-then-token-kept"
stdin = '''
? provider show stablehand-a
? provider add stablehand-a --about x --auth-url https://api.anthropic.com --token-url https://api.anthropic.com --api-base https://api.anthropic.com --host api.anthropic.com
? provider add stablehand-a --auth-url https://api.anthropic.com --token-url https://api.anthropic.com --api-base https://api.anthropic.com --host api.anthropic.com
? provider show stablehand-a
<sk-ant-oat01-stand-in| login stablehand-a --token-stdin
token stablehand-a --json
<sk-ant-oat01-renewed| login stablehand-a --token-stdin
token stablehand-a --json
'''

[[standin.case]]
name = "no-token-not-logged-in"
stdin = '''
token stablehand-nobody --json
? provider add stablehand-a --auth-url https://chatgpt.com --token-url https://chatgpt.com --api-base https://chatgpt.com --host chatgpt.com
token stablehand-a --json
? login stablehand-nobody --token-stdin
'''

[[standin.case]]
name = "token-refused-keeps-nothing"
fault = "token-refused"
stdin = '''
? provider add stablehand-a --auth-url https://api.anthropic.com --token-url https://api.anthropic.com --api-base https://api.anthropic.com --host api.anthropic.com
<two words| login stablehand-a --token-stdin
token stablehand-a --json
'''

[[standin.case]]
name = "provider-refused-made-nothing"
fault = "add-refused"
stdin = '''
? provider add stablehand-a --auth-url https://api.anthropic.com --token-url https://api.anthropic.com --api-base https://api.anthropic.com --host 'bad host'
? provider show stablehand-a
'''

# mytokens holds the agent-account-* entries `account import --from-mytokens`
# moves into stablehand: `list`, then `get` of each entry's fields
# (tests/contract/mytokens-steps). It only reads, and prints no value: a real
# run reads this host's own entries, so it needs at least one portable entry
# with a token and one bound to a machine.
[[standin]]
name = "mytokens"
run = ["tests/contract/mytokens-steps", "tests/contract/fake-mytokens"]
real = ["tests/contract/mytokens-steps", "mytokens"]
needs = "mytokens on PATH holding agent-account-* entries: one with CLAUDE_CODE_OAUTH_TOKEN, one with MACHINE"
ready = ["mytokens", "list"]
version = ["sh", "-c", "mytokens list >/dev/null && echo mytokens"]
faults = ["get-fails"]
fault_env = "FAKE_MYTOKENS_FAULT"

[[standin.case]]
name = "entries-and-their-fields"
stdin = '''
list
get HARNESS
get MACHINE
get CLAUDE_CODE_OAUTH_TOKEN
'''

[[standin.case]]
name = "a-field-not-read"
fault = "get-fails"
stdin = '''
get STABLEHAND_NO_SUCH_FIELD
'''
