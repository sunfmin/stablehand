# stablehand's ties to the real programs and endpoints its tests stand in for
# (`truefit --help`). Each engine reader's stand-in is declared here as a
# [[standin]] when its ticket lands, with the cases it answers;
# `truefit contract` (in ./gate.sh) runs them against the stand-ins,
# `truefit contract --real <engine>`, outside the gate, against the engine.

[contract]
standins = ["tests/contract/fake-*"]

# claude-code's reader (src/readers/claude_code.rs) asks two ways, and
# claude-code-shape runs the one a case's arguments are. Its usage:
# api.anthropic.com/api/oauth/usage through curl (src/curl.rs), the bearer on
# curl's stdin, through usage-shape: curl's exit, the HTTP status, the
# windows' shape or the error's. A `claude setup-token` token, which that
# refuses (403 scope), is asked the question: one `claude -p` turn on the
# smallest model, the token in CLAUDE_CODE_OAUTH_TOKEN, in an empty config
# dir, through question-shape: the exit, the rate_limit_event's unified
# windows' shape, the result's error. The real side swaps the stand-in
# bearers for real ones, and spends one haiku turn of the setup-token's.
[[standin]]
name = "claude-code"
run = ["tests/contract/claude-code-shape", "fake"]
real = ["tests/contract/claude-code-shape", "real"]
needs = "curl, jq and claude on PATH, a Claude Code login in ~/.claude/.credentials.json, and a `claude setup-token` token in mytokens (profile claude-theplant-jp, or the one STABLEHAND_CONTRACT_SETUP_TOKEN names)"
ready = ["tests/contract/real-claude-code-ready"]
version = ["sh", "-c", "curl --version | head -n 1; claude --version"]
faults = ["unauthorized", "scope", "unreachable", "refused"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer sk-ant-oat01-not-a-token"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-setup-token-is-given-no-usage"
fault = "scope"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <setup-token>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-host-not-reached"
fault = "unreachable"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.invalid/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-setup-token-s-windows-by-the-question"
env = { CLAUDE_CODE_OAUTH_TOKEN = "<setup-token>" }
args = ["-p", "--model", "haiku", "--output-format", "stream-json", "--verbose", "--tools", "", "--strict-mcp-config", "--no-session-persistence", "--setting-sources", "", "--system-prompt", "Answer with one word.", "quota"]

[[standin.case]]
name = "the-question-of-a-refused-token"
fault = "refused"
env = { CLAUDE_CODE_OAUTH_TOKEN = "sk-ant-oat01-not-a-token" }
args = ["-p", "--model", "haiku", "--output-format", "stream-json", "--verbose", "--tools", "", "--strict-mcp-config", "--no-session-persistence", "--setting-sources", "", "--system-prompt", "Answer with one word.", "quota"]

# agy's reader (src/readers/agy.rs) runs `agy -p /usage --output-format json`
# in the account's home. Both sides answer through agy-shape, which keeps only
# what the reader reads: the exit, the status, the error, each bucket's shape.
# The real side is this user's own agy login; signed out, a new empty home
# (agy waits 60s for a browser sign-in first).
[[standin]]
name = "agy"
run = ["tests/contract/agy-shape", "fake-agy"]
real = ["tests/contract/agy-shape", "agy"]
needs = "agy and jq on PATH, and this user's HOME signed in to agy with a Google account"
ready = ["tests/contract/real-agy-ready"]
version = ["agy", "--version"]
faults = ["signed-out"]
fault_env = "FAKE_AGY_FAULT"

[[standin.case]]
name = "a-login-s-model-groups"
args = ["-p", "/usage", "--output-format", "json"]

[[standin.case]]
name = "a-home-signed-out"
fault = "signed-out"
args = ["-p", "/usage", "--output-format", "json"]
env = { AGY_SHAPE_HOME = "signed-out" }
# kimi's reader (src/readers/kimi.rs) asks api.kimi.com/coding/v1/usages
# through curl (src/curl.rs), the bearer on curl's stdin. Both sides answer
# through kimi-usages-shape, which keeps only what the reader reads: curl's
# exit, the HTTP status, the windows' shape or the error's. The real side
# swaps the stand-in bearer for this user's Kimi Code login.
[[standin]]
name = "kimi"
run = ["tests/contract/kimi-usages-shape", "kimi-fake-curl"]
real = ["tests/contract/kimi-usages-shape", "kimi-real-curl"]
needs = "curl and jq on PATH and a Kimi Code login in ~/.kimi-code (or $KIMI_CODE_HOME) whose 15-minute access token is fresh: start a kimi session first"
ready = ["tests/contract/kimi-real-curl-ready"]
version = ["sh", "-c", "curl --version | head -n 1"]
faults = ["unauthorized", "unreachable"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.kimi.com/coding/v1/usages"]
stdin = """
header = "Authorization: Bearer <login>"
header = "Accept: application/json"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.kimi.com/coding/v1/usages"]
stdin = """
header = "Authorization: Bearer sk-kimi-not-a-token"
header = "Accept: application/json"
"""

[[standin.case]]
name = "a-host-not-reached"
fault = "unreachable"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.kimi.invalid/coding/v1/usages"]
stdin = """
header = "Authorization: Bearer <login>"
header = "Accept: application/json"
"""
# codex's reader (src/readers/chatgpt.rs) asks `codex app-server`
# `account/rateLimits/read` on its stdin, held open until it answers;
# codex-shape asks it so, and keeps only what the reader reads: whether primary and
# secondary are each a window or none, or that an error says a message.
[[standin]]
name = "codex"
run = ["tests/contract/codex-shape", "fake-codex"]
real = ["tests/contract/codex-shape", "codex"]
needs = "codex and jq on PATH, and a ChatGPT login of codex's in ~/.codex/auth.json (or $CODEX_HOME's)"
ready = ["sh", "-c", "command -v codex >/dev/null && command -v jq >/dev/null && jq -e .tokens.account_id \"${CODEX_HOME:-$HOME/.codex}/auth.json\" >/dev/null"]
version = ["codex", "--version"]
faults = ["logged-out"]
fault_env = "FAKE_CODEX_FAULT"

[[standin.case]]
name = "an-account-s-windows"
args = ["app-server"]

[[standin.case]]
name = "a-home-logged-out"
fault = "logged-out"
env = { CODEX_HOME = "<empty>" }
args = ["app-server"]

# pi's reader (src/readers/chatgpt.rs) asks
# chatgpt.com/backend-api/wham/usage through curl, pi's bearer and its
# login's ChatGPT-Account-Id on curl's stdin. wham-shape keeps only what the
# reader reads; the real side swaps the stand-ins for pi's login.
[[standin]]
name = "pi"
run = ["tests/contract/wham-shape", "fake-curl"]
