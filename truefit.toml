# Promises are made where each fact lives: the manual (the doc comments on
# clap's types in src/main.rs, the refusal codes in src/refusal.rs; `stablehand
# help all` prints it) and the ADRs. truefit reads src/main.rs as text, so a
# candidate may carry `///` or code beside it: mark it by its words.
[promises]
sources = ["src/main.rs", "src/refusal.rs", "docs/adr/*.md"]

