ready = ["sh", "-c", "command -v curl >/dev/null && command -v jq >/dev/null && pi auth check --provider openai-codex >/dev/null"]
version = ["pi", "--version"]
faults = ["unauthorized", "unreachable"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://chatgpt.com/backend-api/wham/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "ChatGPT-Account-Id: <account-id>"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://chatgpt.com/backend-api/wham/usage"]
stdin = """
header = "Authorization: Bearer not-a-token"
header = "ChatGPT-Account-Id: <account-id>"
"""

[[standin.case]]
name = "a-host-not-reached"
