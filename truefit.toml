# stablehand's ties to the real programs and endpoints its tests stand in for
# (`truefit --help`). Each engine reader's stand-in is declared here as a
# [[standin]] when its ticket lands, with the cases it answers;
# `truefit contract` (in ./gate.sh) runs them against the stand-ins,
# `truefit contract --real <engine>`, outside the gate, against the engine.

[contract]
standins = ["tests/contract/fake-*"]

# claude-code's reader (src/readers/claude_code.rs) asks
# api.anthropic.com/api/oauth/usage through curl (src/curl.rs), the bearer on
# curl's stdin. Both sides answer through usage-shape, which keeps only what
# the reader reads: curl's exit, the HTTP status, the windows' shape or the
# error's. The real side swaps the stand-in bearers for real ones.
[[standin]]
name = "claude-code"
run = ["tests/contract/usage-shape", "fake-curl"]
real = ["tests/contract/usage-shape", "real-curl"]
needs = "curl and jq on PATH, a Claude Code login in ~/.claude/.credentials.json, and a `claude setup-token` token in mytokens (profile claude-theplant-jp, or the one STABLEHAND_CONTRACT_SETUP_TOKEN names)"
ready = ["tests/contract/real-curl-ready"]
version = ["sh", "-c", "curl --version | head -n 1"]
faults = ["unauthorized", "scope", "unreachable"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer sk-ant-oat01-not-a-token"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-setup-token-is-given-no-usage"
fault = "scope"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <setup-token>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-host-not-reached"
fault = "unreachable"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.invalid/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

# A portable login's token (src/sesame.rs): `sesame token <account> --json`.
[[standin]]
name = "sesame"
run = ["tests/contract/fake-sesame"]
real = ["sesame"]
version = ["sesame", "--version"]
no_faults = { why = "stablehand only tells a token from a failure, and books the failure as a failed try; nothing has taken effect before it", sha256 = "ec9e60c1bf13515c7c57c3d5e33bf3efcd6f0958e23f1bf02fc775d6d5edfd9b" }

[[standin.case]]
name = "a-token-handed"
args = ["token", "claude-felix", "--json"]
env = { SESAME_TOKEN_CLAUDE_FELIX = "sk-ant-oat01-standin", SESAME_PROVIDERS = '{"claude-felix": {"auth_url": {"value": "https://claude.ai/oauth/authorize"}, "token_url": {"value": "https://console.anthropic.com/v1/oauth/token"}, "api_base": {"value": "https://api.anthropic.com"}, "hosts": {"value": ["api.anthropic.com"]}}}' }

[[standin.case]]
name = "an-unknown-provider"
args = ["token", "stablehand-contract-none", "--json"]
env = { SESAME_PROVIDERS = "{}" }

# stablehand's promises (`truefit promise`): each sentence of README.md that a
# run could break, with the tests that keep it named in the comment above it.
[promises]
sources = ["README.md"]

# tests/register.rs add_list_show_edit_and_rm
[[promise]]
name = "edit-changes-only-the-terms-given"
says = '''`account edit` changes only the terms given; `--unset machine|sessions|expires|home` clears one.'''
source = "README.md:31"
check = ["test"]

# tests/register.rs refusals_name_the_fix_and_write_nothing
[[promise]]
name = "a-refusal-writes-nothing"
says = '''A refusal prints `{"error": "…"}`, naming each fault with its fix, exits non-zero and writes nothing'''
source = "README.md:34"
check = ["test"]

# tests/register.rs add_list_show_edit_and_rm
[[promise]]
name = "rm-twice-same-register"
says = '''`account rm` of an account not kept answers `"removed": false`, so running it twice leaves the same register.'''
source = "README.md:35"
check = ["test"]
why = "twice one after the other, not at once: one rm is one DELETE, and the test runs it twice and reads the register"

# tests/register.rs the_store_is_0600_in_a_0700_directory
[[promise]]
name = "db-file-0600-dir-0700"
says = '''the file is 0600, the directory 0700.'''
source = "README.md:36"
check = ["test"]

# tests/usage.rs read_books_a_bound_login_s_windows_once_an_hour_unless_now
[[promise]]
name = "bearer-on-curl-s-stdin"
says = '''The bearer goes to curl on its stdin, never on a command line.'''
source = "README.md:56"
check = ["test"]

# tests/usage.rs read_books_a_bound_login_s_windows_once_an_hour_unless_now,
# a_portable_login_is_read_with_sesame_s_token_and_a_setup_token_gets_a_limit;
# src/books_tests.rs the_account_s_pace_is_its_worst_window_s and the pace tests
[[promise]]
name = "status-windows-and-pace"
says = '''`status` answers each account's windows (each with its `group` where the engine groups them), used %, resets at, source (`read` or `limit`), `stale`, and pace: `tight` (at its recent rate it runs out before it resets), `spare` (it resets within a quarter of its length with 20% or more left), `used_up`, or `steady`. The account's pace is its worst window's.'''
source = "README.md:61"
check = ["test"]

# src/books_tests.rs a_reading_older_than_two_hours_makes_no_window_tight_on_its_own,
# a_night_s_burst_in_a_week_under_half_used_is_not_tight
[[promise]]
name = "guild-pace-rules"
says = '''The rules are Guild's ledger's: a reading over two hours old, or a window under half used, is never tight on its own.'''
source = "README.md:66"
check = ["test"]
