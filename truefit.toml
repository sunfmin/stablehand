# stablehand's ties to the real programs and endpoints its tests stand in for
# (`truefit --help`). Each engine reader's stand-in is declared here as a
# [[standin]] when its ticket lands, with the cases it answers;
# `truefit contract` (in ./gate.sh) runs them against the stand-ins,
# `truefit contract --real <engine>`, outside the gate, against the engine.

[contract]
standins = ["tests/contract/fake-*"]

# claude-code's reader (src/readers/claude_code.rs) asks
# api.anthropic.com/api/oauth/usage through curl (src/curl.rs), the bearer on
# curl's stdin. Both sides answer through usage-shape, which keeps only what
# the reader reads: curl's exit, the HTTP status, the windows' shape or the
# error's. The real side swaps the stand-in bearers for real ones. The
# endpoint answers a host only a few times an hour (HTTP 429, retry-after
# about an hour): run the real side after an hour without it.
[[standin]]
name = "claude-code"
run = ["tests/contract/usage-shape", "fake-curl"]
real = ["tests/contract/usage-shape", "real-curl"]
needs = "curl and jq on PATH, a Claude Code login in ~/.claude/.credentials.json, a `claude setup-token` token in mytokens (profile claude-theplant-jp, or the one STABLEHAND_CONTRACT_SETUP_TOKEN names), and no call of this host's to the endpoint in the last hour"
ready = ["tests/contract/real-curl-ready"]
version = ["sh", "-c", "curl --version | head -n 1"]
faults = ["unauthorized", "scope", "unreachable"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer sk-ant-oat01-not-a-token"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-setup-token-is-given-no-usage"
fault = "scope"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.com/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <setup-token>"
header = "anthropic-beta: oauth-2025-04-20"
"""

[[standin.case]]
name = "a-host-not-reached"
fault = "unreachable"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://api.anthropic.invalid/api/oauth/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "anthropic-beta: oauth-2025-04-20"
"""

# The question claude-code's reader asks a `claude setup-token` token, which
# the usage endpoint refuses (403 scope): one `claude -p` turn on the
# smallest model, the token in CLAUDE_CODE_OAUTH_TOKEN, in a new empty config
# dir. Both sides answer through question-shape: the exit, the last
# rate_limit_event's unified windows' shape, the result's error. The real
# side swaps `<setup-token>` for a real one, and spends one haiku turn of it.
[[standin]]
name = "claude-code-question"
run = ["tests/contract/question-shape", "fake-claude"]
real = ["tests/contract/question-shape", "real-claude"]
needs = "claude, jq and mytokens on PATH, and a `claude setup-token` token in mytokens (profile claude-theplant-jp, or the one STABLEHAND_CONTRACT_SETUP_TOKEN names)"
ready = ["sh", "-c", "command -v claude >/dev/null && command -v jq >/dev/null && mytokens list 2>/dev/null | grep -q \"^${STABLEHAND_CONTRACT_SETUP_TOKEN:-claude-theplant-jp}/\""]
version = ["claude", "--version"]
faults = ["refused"]
fault_env = "FAKE_CLAUDE_FAULT"

[[standin.case]]
name = "a-setup-token-s-windows"
env = { CLAUDE_CODE_OAUTH_TOKEN = "<setup-token>" }
args = ["-p", "--model", "haiku", "--output-format", "stream-json", "--verbose", "--tools", "", "--strict-mcp-config", "--no-session-persistence", "--setting-sources", "", "--system-prompt", "Answer with one word.", "quota"]

[[standin.case]]
name = "a-refused-token"
fault = "refused"
env = { CLAUDE_CODE_OAUTH_TOKEN = "sk-ant-oat01-not-a-token" }
args = ["-p", "--model", "haiku", "--output-format", "stream-json", "--verbose", "--tools", "", "--strict-mcp-config", "--no-session-persistence", "--setting-sources", "", "--system-prompt", "Answer with one word.", "quota"]

# The organization a claude-code token's answers name
# (src/readers/claude_code.rs `organization`), which `account scan` compares
# with the bound logins' (a `claude setup-token` token is refused
# user:profile): `POST /v1/messages` of an empty request through curl, the
# bearer on curl's stdin, refused HTTP 400 before any turn. The usage
# endpoint's 403 names none (2026-11-25). Both sides answer through
# organization-shape: curl's exit, the status, whether the header is an
# organization id. The stand-in answers the recorded answer
# (recorded/claude-code-organization.http); the real side swaps
# `<setup-token>` for a real one and spends nothing.
[[standin]]
name = "claude-code-organization"
run = ["tests/contract/organization-shape", "fake-curl"]
real = ["tests/contract/organization-shape", "real-curl"]
needs = "curl, jq and mytokens on PATH, and a `claude setup-token` token in mytokens (profile claude-theplant-jp, or the one STABLEHAND_CONTRACT_SETUP_TOKEN names)"
ready = ["sh", "-c", "command -v curl >/dev/null && command -v jq >/dev/null && mytokens list 2>/dev/null | grep -q \"^${STABLEHAND_CONTRACT_SETUP_TOKEN:-claude-theplant-jp}/\""]
version = ["sh", "-c", "curl --version | head -n 1"]
faults = ["unauthorized"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-token-s-organization"
args = ["--silent", "--show-error", "--max-time", "20", "--data", "{}", "--config", "-", "--write-out", "\n%header{anthropic-organization-id}\n%{http_code}", "https://api.anthropic.com/v1/messages"]
stdin = """
header = "Authorization: Bearer <setup-token>"
header = "anthropic-beta: oauth-2025-04-20"
header = "anthropic-version: 2023-06-01"
"""

[[standin.case]]
name = "a-refused-bearer-names-none"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--data", "{}", "--config", "-", "--write-out", "\n%header{anthropic-organization-id}\n%{http_code}", "https://api.anthropic.com/v1/messages"]
stdin = """
header = "Authorization: Bearer sk-ant-oat01-not-a-token"
header = "anthropic-beta: oauth-2025-04-20"
header = "anthropic-version: 2023-06-01"
"""

# agy's reader (src/readers/agy.rs) runs `agy -p /usage --output-format json`
# in the account's home, then `agy models` there. Both sides answer through
# agy-shape, which keeps only what the reader reads: the exit, the status,
# the error, each group's description's and bucket's shape; of `models`,
# whether its lines are ids and names. A bucket's reset is a time or none
# (agy 1.5.17 answers a disabled one without reset_time), read alike.
# The real side is this user's own agy login; signed out, a new empty home
# (agy waits 60s for a browser sign-in first).
[[standin]]
name = "agy"
run = ["tests/contract/agy-shape", "tests/contract/fake-agy"]
real = ["tests/contract/agy-shape", "agy"]
needs = "agy and jq on PATH, and this user's HOME signed in to agy with a Google account"
ready = ["tests/contract/real-agy-ready"]
version = ["agy", "--version"]
faults = ["signed-out"]
fault_env = "FAKE_AGY_FAULT"

[[standin.case]]
name = "a-login-s-model-groups"
args = ["-p", "/usage", "--output-format", "json"]

[[standin.case]]
name = "a-home-signed-out"
fault = "signed-out"
args = ["-p", "/usage", "--output-format", "json"]
env = { AGY_SHAPE_HOME = "signed-out" }

# Once a group's weekly limit is hit, its 5h bucket is disabled and has no
# reset_time. The real side answers what this week holds, read alike either
# way.
[[standin.case]]
name = "a-group-s-week-used-up"
env = { FAKE_AGY_WEEK = "used-up" }
args = ["-p", "/usage", "--output-format", "json"]

[[standin.case]]
name = "a-login-s-models"
args = ["models"]

[[standin.case]]
name = "a-home-signed-out-lists-no-model"
fault = "signed-out"
args = ["models"]
env = { AGY_SHAPE_HOME = "signed-out" }
# kimi's reader (src/readers/kimi.rs) asks api.kimi.com/coding/v1/usages
# through curl (src/curl.rs), the bearer on curl's stdin. Both sides answer
# through kimi-usages-shape, which keeps only what the reader reads: curl's
# exit, the HTTP status, the windows' shape or the error's. The real side
