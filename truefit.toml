version = ["pi", "--version"]
faults = ["unauthorized", "unreachable"]
fault_env = "FAKE_CURL_FAULT"

[[standin.case]]
name = "a-login-s-windows"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://chatgpt.com/backend-api/wham/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "ChatGPT-Account-Id: <account-id>"
"""

[[standin.case]]
name = "a-refused-bearer"
fault = "unauthorized"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://chatgpt.com/backend-api/wham/usage"]
stdin = """
header = "Authorization: Bearer not-a-token"
header = "ChatGPT-Account-Id: <account-id>"
"""

[[standin.case]]
name = "a-host-not-reached"
fault = "unreachable"
args = ["--silent", "--show-error", "--max-time", "20", "--config", "-", "--write-out", "\n%{http_code}", "https://chatgpt.invalid/backend-api/wham/usage"]
stdin = """
header = "Authorization: Bearer <login>"
header = "ChatGPT-Account-Id: <account-id>"
"""

# pi's bearer: `pi auth print-bearer-token --provider openai-codex`, which
# the pi reader runs first. pi-bearer-shape never prints it.
[[standin]]
name = "pi-bearer"
run = ["tests/contract/pi-bearer-shape", "fake-pi"]
